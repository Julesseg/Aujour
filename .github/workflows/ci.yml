name: CI

# Pull requests only. A `pull_request` run already builds `main` with the
# branch merged into it, so a `push: branches: [main]` trigger re-tested that
# same tree the moment the PR landed — every merged PR ended up showing two of
# every check, one `(pull_request)` and one `(push)`, and paid twice for the
# macOS XCUITest job.
#
# What that trigger did buy was cover for a stale merge base: `main` moving
# between the run and the merge leaves a tree nobody tested. That belongs to
# branch protection — require the branch to be up to date before merging, and
# the PR run *is* the run for the commit that lands.
on:
  pull_request:

# The one project-specific value in this workflow. Must match the name of the
# Xcode project/scheme on disk (App/<APP_NAME>.xcodeproj) — scripts/rename.sh
# keeps them in sync.
env:
  APP_NAME: Aujour

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core · swift test (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
      - name: Run Core tests
        working-directory: Core
        run: swift test

  app-ui-tests:
    # Aujour ships universal (TARGETED_DEVICE_FAMILY = "1,2"), and the two
    # families do not lay out the same: an iPad is a regular-width size class
    # where an iPhone in portrait is compact. A suite that only ever ran on
    # iPhone could not see a split view that never collapses, a sheet that
    # presents as a form sheet, or a toolbar that moves. So run the whole suite
    # once per family.
    #
    # The legs are independent — `fail-fast: false` so an iPad-only regression
    # still reports the iPhone result rather than cancelling it.
    #
    # `device` is both the check's name and the prefix the simulator is
    # resolved by — every simulator in a family is named after it.
    name: App · XCUITest (${{ matrix.device }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Everything the scheme tests: `AujourTests` over real temporary
          # folders, plus the UI suite.
          - device: iPhone
            only: ''
          # The UI suite alone. `AujourTests` covers the store, iCloud and
          # file coordination — headless work against temporary folders, with
          # no view and so nothing a size class can change. Running it a
          # second time buys no coverage; it only doubles the runtime and the
          # chances of a flake there failing a PR.
          - device: iPad
            only: '-only-testing:AujourUITests'
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: xcodebuild -version

      - name: Resolve and boot a ${{ matrix.device }} simulator
        id: sim
        env:
          DEVICE_PREFIX: ${{ matrix.device }}
        run: |
          set -euo pipefail
          # By UDID rather than name, so the device booted below is provably
          # the one xcodebuild targets.
          SIM=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json, os, sys
          prefix = os.environ['DEVICE_PREFIX']
          runtimes = json.load(sys.stdin)['devices']
          matches = [d for runtime in runtimes for d in runtimes[runtime] if d['name'].startswith(prefix)]
          if not matches:
              sys.exit(f'::error::no {prefix} simulator is available on this runner')
          chosen = sorted(matches, key=lambda d: d['name'])[-1]
          print(f\"{chosen['name']}|{chosen['udid']}\")
          ")
          NAME=${SIM%%|*}
          UDID=${SIM##*|}
          echo "Using simulator: $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

          # Boot ahead of xcodebuild instead of letting it boot on demand. A
          # cold headless boot inside `xcodebuild test` is what fails with
          # "Timed out waiting for AX loaded notification" or "Timed out while
          # requesting launch progress" — a flake with no bearing on the code
          # under test, and indistinguishable from a real failure until you
          # read the log. `bootstatus -b` boots the device if it is not
          # already up and blocks until it has finished coming up.
          xcrun simctl bootstatus "$UDID" -b

      - name: Build & run UI tests
        working-directory: App
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            ${{ matrix.only }} \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          # Per family — upload-artifact@v4 rejects a name a sibling job in the
          # same run already claimed.
          name: ui-test-results-${{ matrix.device }}
          path: App/TestResults.xcresult
          if-no-files-found: ignore
